name: Build and Push vibe-gateway to GHCR

on:
  push:
    branches:
      - main
      - dev
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev protobuf-compiler

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

  build-and-push:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: ghcr.io/vibe-social-app/vibe-gateway

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set tags
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build image
        run: podman build -t vibe-gateway:latest .

      - name: Tag latest
        run: podman tag vibe-gateway:latest $IMAGE_NAME:latest

      - name: Tag commit sha
        run: podman tag vibe-gateway:latest $IMAGE_NAME:${{ env.SHORT_SHA }}

      - name: Push latest
        run: podman push $IMAGE_NAME:latest

      - name: Push sha tag
        run: podman push $IMAGE_NAME:${{ env.SHORT_SHA }}

  # Deploys this service through infra-ansible after the image was built from main.
  # Put [skip deploy] in the commit message to publish the image without deploying.
  # Plain REST calls on purpose: the token only has "Actions: read and write" on infra-ansible,
  # while `gh workflow run` also needs to read the default branch (contents) and fails.
  deploy:
    needs: build-and-push
    if: ${{ github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip deploy]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via infra-ansible
        env:
          GH_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::INFRA_DISPATCH_TOKEN is not set; image published but not deployed"
            exit 0
          fi
          api=repos/Vibe-Social-App/infra-ansible/actions
          id="${GITHUB_REPOSITORY##*/}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh api -X POST "$api/workflows/deploy.yml/dispatches" -f ref=main -f "inputs[service]=api_gateway" -f "inputs[correlation_id]=$id"
          run=""
          for i in $(seq 1 40); do
            run=$(gh api "$api/workflows/deploy.yml/runs?event=workflow_dispatch&per_page=30" --jq ".workflow_runs[]|select(.display_title|endswith(\"$id\"))|.id" | head -1)
            [ -n "$run" ] && break
            sleep 3
          done
          [ -n "$run" ] || { echo "::error::could not find the deploy run"; exit 1; }
          echo "deploy run: https://github.com/Vibe-Social-App/infra-ansible/actions/runs/$run"
          while true; do
            state=$(gh api "$api/runs/$run" --jq '"\(.status) \(.conclusion)"')
            case "$state" in
              "completed success") echo "deploy finished: success"; exit 0 ;;
              completed*) echo "::error::deploy finished: $state"; exit 1 ;;
            esac
            sleep 10
          done
